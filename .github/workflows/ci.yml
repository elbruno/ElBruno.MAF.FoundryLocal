name: Validate adapter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore ElBruno.MAF.FoundryLocal.slnx

      - name: Build
        run: dotnet build ElBruno.MAF.FoundryLocal.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test ElBruno.MAF.FoundryLocal.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/ElBruno.MAF.FoundryLocal/ElBruno.MAF.FoundryLocal.csproj -c Release --no-build -o artifacts
